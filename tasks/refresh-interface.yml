---
# Python's standard library avoids a controller-side netaddr dependency.
# Read the live interface, not the default route (which may use another NIC).
- name: Derive the first usable IPv4 address and validate the ARP target
  ansible.builtin.command:
    argv:
      - "{{ ansible_facts.python.executable }}"
      - -c
      - |
        import ipaddress, json, shutil, subprocess, sys
        iface = sys.argv[1]
        ip = shutil.which('ip')
        ping = shutil.which('ping')
        if not ip or not ping:
            sys.exit('Install iproute2 and iputils ping before running this play.')
        def read(args):
            return json.loads(subprocess.check_output([ip, '-j', '-4'] + args))
        links = read(['address', 'show', 'dev', iface])
        if len(links) != 1 or 'UP' not in links[0]['flags'] or 'NOARP' in links[0]['flags']:
            sys.exit('Interface must be UP and support ARP.')
        addresses = [a for a in links[0]['addr_info'] if a['scope'] == 'global']
        networks = {ipaddress.ip_interface(a['local'] + '/' + str(a['prefixlen'])).network
                    for a in addresses}
        if len(networks) != 1:
            sys.exit('Select an interface with exactly one global IPv4 subnet.')
        network = networks.pop()
        if network.prefixlen >= 31:
            sys.exit('/31 and /32 networks do not support the assumed router addressing convention.')
        router = str(network.network_address + 1)
        if router in {a['local'] for a in addresses}:
            sys.exit('Derived router address belongs to this server; refusing to clear it.')
        neighbors = read(['neigh', 'show', 'to', router + '/32', 'dev', iface, 'nud', 'all'])
        if any(set(n.get('state', [])) & {'PERMANENT', 'NOARP'} for n in neighbors):
            sys.exit('Router has a static/NOARP entry; update its configuration explicitly.')
        print(json.dumps({'router': router, 'network': str(network), 'ip': ip, 'ping': ping,
                          'before': neighbors}))
      - "{{ arp_current_interface }}"
  register: arp_discovery
  changed_when: false
  check_mode: false

- name: Record the discovered router and tools
  ansible.builtin.set_fact:
    arp_target: "{{ arp_discovery.stdout | from_json }}"

- name: Display the exact ARP entry to refresh
  ansible.builtin.debug:
    msg:
      - "Interface={{ arp_current_interface }} subnet={{ arp_target.network }} router={{ arp_target.router }}"
      - "Existing entry: {{ arp_target.before }}"
      - "Clear this dynamic entry, trigger ARP resolution, then verify SSH and the learned MAC."

# Async is unsupported in check mode. Discovery above still previews the target.
- name: Refresh ARP and recover connectivity
  when: not ansible_check_mode
  block:
    # Both operations run on the server in one detached job. Never flush the
    # entire neighbour table or bounce the interface. Default flush excludes
    # permanent and NOARP entries, as recommended by ip-neighbour(8).
    - name: Launch detached removal and immediate router rediscovery
      ansible.builtin.command:
        argv:
          - "{{ ansible_facts.python.executable }}"
          - -c
          - |
            import json, subprocess, sys, time
            ip, ping, iface, router, timeout = sys.argv[1:]
            # Give Ansible a moment to receive the asynchronous job ID.
            time.sleep(2)
            subprocess.run([ip, '-4', 'neigh', 'flush', 'to', router + '/32',
                            'dev', iface], check=True)
            deadline = time.monotonic() + int(timeout)
            while time.monotonic() < deadline:
                # An ICMP reply is optional: sending triggers kernel ARP.
                try:
                    subprocess.run([ping, '-n', '-I', iface, '-c', '1', '-W', '1', router],
                                   stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, timeout=3)
                except subprocess.TimeoutExpired:
                    pass  # A delayed ping must not terminate ARP recovery.
                entries = json.loads(subprocess.check_output(
                    [ip, '-j', '-4', 'neigh', 'show', 'to', router + '/32', 'dev', iface]))
                if any(n.get('lladdr') and set(n.get('state', [])) &
                       {'REACHABLE', 'STALE', 'DELAY', 'PROBE'} for n in entries):
                    print(json.dumps(entries))
                    break
                time.sleep(1)
            else:
                sys.exit('Router ARP resolution timed out; check replacement and link/VLAN connectivity.')
          - "{{ arp_target.ip }}"
          - "{{ arp_target.ping }}"
          - "{{ arp_current_interface }}"
          - "{{ arp_target.router }}"
          - "{{ arp_recovery_timeout | string }}"
      async: "{{ (arp_recovery_timeout | int) + 30 }}"
      poll: 0
      register: arp_job
      changed_when: true
      # Only tolerate transport loss here; ordinary command failures remain fatal.
      ignore_unreachable: true

    - name: Discard the SSH connection that may cross the replaced router
      ansible.builtin.meta: reset_connection

    - name: Wait for working SSH and Ansible after the ARP refresh
      ansible.builtin.wait_for_connection:
        timeout: "{{ arp_connection_timeout | int }}"
        sleep: 2
        connect_timeout: 5

    - name: Ensure the detached job was acknowledged
      ansible.builtin.assert:
        that: arp_job.ansible_job_id is defined
        fail_msg: >-
          SSH recovered but the job acknowledgement was lost. Completion is
          unverified; rerun this play to safely refresh and verify the entry.

    # Reset per-interface status so an earlier interface cannot satisfy this check.
    - name: Initialize the current interface job status
      ansible.builtin.set_fact:
        arp_result: {}

    # Ansible's until does not retry SSH-unreachable exceptions. Explicitly
    # reconnect and resume polling, with at most three polling sessions.
    - name: Reconnect and collect the detached job result
      ansible.builtin.include_tasks: poll-recovery.yml
      loop: [1, 2, 3]
      loop_control:
        loop_var: arp_poll_session
      when: not (arp_result.finished | default(false) | bool)

    - name: Require verified successful ARP recovery
      ansible.builtin.assert:
        that:
          - not (arp_result.unreachable | default(false) | bool)
          - arp_result.finished | default(false) | bool
          - arp_result.rc | default(-1) | int == 0
        fail_msg: Unable to verify ARP recovery after three polling sessions; restore connectivity and rerun.

    - name: Remove the completed asynchronous job record
      ansible.builtin.async_status:
        jid: "{{ arp_job.ansible_job_id }}"
        mode: cleanup

    - name: Report recovered SSH and the refreshed router neighbour entry
      ansible.builtin.debug:
        msg: "SSH is working. Learned router entry: {{ arp_result.stdout | from_json }}"
